version: '3.8'

services:
  backend:
    build: ./backend
    container_name: agrovision-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/agrovision}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey}
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: agrovision-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
